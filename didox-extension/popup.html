<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Didox Ombor Nazorati</title>
  <style>
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #ffffff;
      color: #1e293b;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
      margin-bottom: 14px;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 800;
      color: #4f46e5;
    }
    .status-badge {
      margin-left: auto;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 10px;
    }
    .search-box {
      margin-bottom: 12px;
    }
    .search-box input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 12px;
      font-size: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
    }
    .search-box input:focus {
      border-color: #4f46e5;
    }
    .results {
      max-height: 220px;
      overflow-y: auto;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .res-item {
      padding: 8px;
      border-bottom: 1px solid #f1f5f9;
    }
    .res-item:hover {
      background: #f8fafc;
    }
    .btn-full {
      width: 100%;
      padding: 9px;
      background: #4f46e5;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: block;
      box-sizing: border-box;
    }
    .btn-full:hover {
      background: #4338ca;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 20px;">🛡️</span>
    <div>
      <div class="brand-title">DIDOX AUDITOR</div>
      <div style="font-size: 11px; color: #64748b;">Ombor &amp; MXIK Yordamchisi</div>
    </div>
    <span class="status-badge" id="syncStatus">Faol</span>
  </div>

  <div class="search-box">
    <input type="text" id="quickSearchInput" placeholder="Tezkor MXIK &amp; tovar qidiruvi..." />
  </div>

  <div class="results" id="quickSearchResults">
    <div style="text-align: center; color: #94a3b8; padding: 20px;">
      Tovar nomini yozing — ombordagi qoldig'i chiqadi.
    </div>
  </div>

  <a href="https://didox-auditor.vercel.app" target="_blank" class="btn-full">
    🌐 To'liq Auditor Panelini Ochish
  </a>

  <script src="popup.js"></script>
</body>
</html>
